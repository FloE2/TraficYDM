<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bleu:#195d74; --bleu-f:#0f3f50; --bleu-c:#e3eef2;
  --vert:#bccb4e; --vert-f:#7d8a1d;
  --fond:#eef3f4; --encre:#17323d; --gris:#6b7f87; --ligne:#d3dfe3;
  --ok:#2e7d32; --ok-c:#e4f3e5; --ko:#c62828; --ko-c:#fbe6e6; --att:#d98c00; --att-c:#fff3d6;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--fond);color:var(--encre);
  font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:17px;line-height:1.4}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--vert);outline-offset:2px}
.hidden{display:none!important}
h1,h2,h3{margin:0;line-height:1.2}

/* ---------- En-tête ---------- */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bleu);color:#fff;
  display:flex;align-items:center;gap:12px;padding:8px 14px}
header.top img{width:44px;height:44px;border-radius:10px;background:#fff;padding:2px}
.h-title{flex:1;min-width:0}
.h-title b{display:block;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h-title small{opacity:.8}
.h-user{display:flex;align-items:center;gap:6px}
.h-user span{font-weight:700;max-width:30vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icobtn{width:44px;height:44px;border-radius:12px;font-size:22px;display:grid;place-items:center;background:rgba(255,255,255,.12);color:#fff}
.icobtn:hover{background:rgba(255,255,255,.22)}
.demo{background:var(--att);color:#fff;text-align:center;font-size:14px;padding:4px 8px}

nav.tabs{display:flex;gap:4px;background:var(--bleu-f);padding:0 8px;overflow-x:auto}
nav.tabs button{color:#cfe2e8;padding:10px 14px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;border-bottom:4px solid transparent;white-space:nowrap}
nav.tabs button .ti{font-size:24px;line-height:1}
nav.tabs button.on{color:#fff;border-bottom-color:var(--vert)}

main{max-width:1100px;margin:0 auto;padding:16px 14px 24px}
.h-row{display:flex;align-items:baseline;gap:10px;min-width:0}
.h-row b{min-width:0}
.h-year{font-size:30px;font-weight:700;color:var(--vert);flex:none;line-height:1}
.login h1 .l-year{display:block;font-size:44px;color:var(--vert);line-height:1.1}
.copy{text-align:center;color:var(--gris);font-size:13px;padding:8px 14px calc(100px + env(safe-area-inset-bottom,0px));opacity:.8}
.login .copy{padding:0}

/* ---------- Connexion ---------- */
.login{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:18px;
  background:linear-gradient(180deg,var(--bleu) 0 38%,var(--fond) 38%)}
.login .logo{width:150px;height:150px;border-radius:28px;background:#fff;padding:8px;box-shadow:0 6px 24px rgba(15,63,80,.25)}
.login h1{color:#fff;text-align:center;font-size:22px}
.panel{background:#fff;border-radius:22px;padding:22px;width:100%;max-width:420px;box-shadow:0 4px 18px rgba(15,63,80,.12)}
.field{display:flex;align-items:center;gap:10px;border:2px solid var(--ligne);border-radius:14px;padding:4px 12px;margin:10px 0;background:#fff}
.field:focus-within{border-color:var(--bleu)}
.field .fi{font-size:26px}
.field input{border:0;outline:0;flex:1;font-size:22px;padding:10px 0;min-width:0;background:transparent}
.bigbtn{width:100%;background:var(--bleu);color:#fff;font-size:22px;font-weight:700;border-radius:14px;padding:14px;margin-top:8px}
.bigbtn:hover{background:var(--bleu-f)}
.bigbtn.vert{background:var(--ok)}
.linkbtn{color:var(--bleu);text-decoration:underline;padding:8px;font-size:15px}
.msg{border-radius:12px;padding:10px 12px;margin:10px 0;font-size:16px}
.msg.err{background:var(--ko-c);color:var(--ko)}
.msg.info{background:var(--bleu-c);color:var(--bleu-f)}
.msg.warn{background:var(--att-c);color:#7a4f00}
.idbox{font-size:30px;font-weight:700;text-align:center;letter-spacing:1px;background:var(--bleu-c);border:2px dashed var(--bleu);border-radius:14px;padding:12px;margin:10px 0;color:var(--bleu-f)}
.note{display:flex;gap:12px;align-items:center;background:var(--att-c);border-radius:14px;padding:12px;font-weight:700}
.note .ni{font-size:40px}

/* ---------- Journée ---------- */
.dayhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.dayhead h2{font-size:26px;text-transform:capitalize;flex:1;min-width:200px}
.navbtn{width:48px;height:48px;border-radius:14px;background:#fff;border:2px solid var(--ligne);font-size:22px}
.datein{height:48px;border-radius:14px;border:2px solid var(--ligne);padding:0 10px;background:#fff}
.pill{height:48px;border-radius:14px;background:var(--bleu);color:#fff;padding:0 14px;font-weight:700}
.pill.light{background:#fff;color:var(--bleu);border:2px solid var(--bleu)}
.sumbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.sum{background:#fff;border-radius:14px;padding:8px 14px;display:flex;align-items:center;gap:8px;font-size:22px;font-weight:700}
.sum small{font-size:14px;font-weight:400;color:var(--gris)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.slot{background:#fff;border-radius:18px;padding:12px;border-left:10px solid #b9c7cc;display:flex;flex-direction:column;gap:10px;position:relative}
.slot.ok{border-left-color:var(--ok);background:linear-gradient(90deg,var(--ok-c),#fff 40%)}
.slot.ko{border-left-color:var(--ko);background:linear-gradient(90deg,var(--ko-c),#fff 40%)}
.slot.pend{border-left-color:var(--att);background:linear-gradient(90deg,var(--att-c),#fff 40%)}
.slot-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.time{font-size:20px;font-weight:700;background:var(--bleu-c);border-radius:12px;padding:6px 10px;color:var(--bleu-f)}
.chips{display:flex;gap:6px;flex-wrap:wrap;cursor:pointer}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:4px 10px 4px 6px;color:#fff;font-size:14px;font-weight:700;white-space:nowrap}
.chip .ci{font-size:18px}
.chip.warn{background:var(--att);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.6}}
.slot-who{display:flex;align-items:center;gap:10px}
.slot-who .big{font-size:40px;line-height:1}
.slot-who div{flex:1;min-width:0}
.slot-who b{display:block;font-size:19px}
.slot-who small{color:var(--gris);font-size:14px}
.match{font-size:26px;width:48px;height:48px;border-radius:14px;border:2px solid var(--ligne);filter:grayscale(1);opacity:.5}
.match.on{filter:none;opacity:1;border-color:var(--att);background:var(--att-c)}
.slot-bottom{display:flex;align-items:center;gap:8px}
.counter{display:flex;align-items:center;border:2px solid var(--ligne);border-radius:16px;overflow:hidden;flex:1}
.counter button{width:58px;height:58px;font-size:32px;font-weight:700;background:var(--bleu-c);color:var(--bleu-f)}
.counter button:active{background:var(--bleu);color:#fff}
.counter input{width:100%;min-width:50px;text-align:center;border:0;outline:0;font-size:30px;font-weight:700;height:58px;-moz-appearance:textfield}
.counter input::placeholder{color:#c3cfd3}
.counter input::-webkit-inner-spin-button{-webkit-appearance:none}
.counter .pi{font-size:22px;padding-left:8px}
.act{width:62px;height:62px;border-radius:16px;font-size:30px;border:3px solid transparent}
.act.okb{background:var(--ok-c)} .act.okb.on{background:var(--ok);border-color:var(--ok)}
.act.kob{background:var(--ko-c)} .act.kob.on{background:var(--ko);border-color:var(--ko)}
.slot-tools{display:flex;gap:6px;justify-content:flex-end}
.tool{height:40px;min-width:40px;border-radius:12px;background:var(--fond);font-size:20px;padding:0 8px}
.readonly-eff{font-size:30px;font-weight:700}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:72px;height:72px;border-radius:24px;background:var(--vert);color:var(--encre);font-size:40px;font-weight:700;box-shadow:0 6px 18px rgba(15,63,80,.3);z-index:15}
.empty{text-align:center;padding:40px 10px;color:var(--gris);font-size:20px}
.empty .ei{font-size:60px;display:block}

/* ---------- Semaine ---------- */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
@media (max-width:900px){.week{grid-template-columns:1fr}}
.wday{background:#fff;border-radius:16px;padding:8px;min-height:80px}
.wday.today{outline:3px solid var(--vert)}
.wday h3{font-size:16px;display:flex;justify-content:space-between;align-items:center;padding:4px 4px 8px;border-bottom:2px solid var(--fond);margin-bottom:6px;cursor:pointer;text-transform:capitalize}
.wday h3 span{font-size:15px;background:var(--bleu-c);color:var(--bleu-f);border-radius:999px;padding:2px 8px}
.wrow{display:flex;gap:6px;align-items:center;padding:5px 4px;border-radius:8px;font-size:14px}
.wrow:nth-child(odd){background:#f6f9fa}
.wrow .wt{font-weight:700;color:var(--bleu-f);white-space:nowrap}
.wrow .wn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrow .we{font-weight:700;white-space:nowrap}
.dot{width:12px;height:12px;border-radius:50%;flex:none}

/* ---------- Admin ---------- */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar h2{flex:1;font-size:24px;min-width:200px}
.seg{display:flex;background:#fff;border-radius:14px;padding:4px;gap:2px;flex-wrap:wrap}
.seg button{padding:8px 12px;border-radius:10px;font-weight:700;color:var(--gris)}
.seg button.on{background:var(--bleu);color:#fff}
.box{background:#fff;border-radius:16px;padding:14px;margin-bottom:14px}
.box h3{font-size:19px;margin-bottom:10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:#fff;border-radius:16px;padding:12px 14px}
.kpi .kv{font-size:30px;font-weight:700;color:var(--bleu-f)}
.kpi .kl{color:var(--gris);font-size:14px}
.kpi.alert .kv{color:var(--att)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:8px;text-align:left;border-bottom:1px solid var(--ligne);white-space:nowrap}
th{color:var(--gris);font-weight:700;font-size:13px}
td.n,th.n{text-align:right}
.bar{height:10px;border-radius:5px;background:var(--bleu-c);min-width:80px;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:5px;background:var(--bleu)}
.heat td{text-align:center;font-weight:700}
.grid2{display:block}
.row-actions{display:flex;gap:4px}
.daytabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.daytabs button{width:56px;height:48px;border-radius:12px;background:#fff;font-weight:700;border:2px solid var(--ligne)}
.daytabs button.on{background:var(--bleu);color:#fff;border-color:var(--bleu)}
.badge{display:inline-block;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700}
.b-ok{background:var(--ok-c);color:var(--ok)} .b-att{background:var(--att-c);color:#7a4f00} .b-ko{background:var(--ko-c);color:var(--ko)}
.chartwrap{position:relative;height:260px}

/* ---------- Fenêtres ---------- */
.modal{position:fixed;inset:0;background:rgba(15,40,50,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.modal{align-items:center}}
.modal-box{background:#fff;width:100%;max-width:640px;max-height:92vh;max-height:92dvh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.modal-box{border-radius:22px}}
.modal-box h2{font-size:24px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.xbtn{font-size:26px;width:44px;height:44px;border-radius:12px;background:var(--fond)}
.pickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-bottom:12px}
.pick{border:3px solid var(--ligne);border-radius:14px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:14px;font-weight:700;background:#fff;min-height:90px;justify-content:center}
.pick .pi{font-size:34px}
.pick.on{border-color:var(--bleu);background:var(--bleu-c)}
.salle-pick{color:#fff;border-color:transparent;opacity:.45}
.salle-pick.on{opacity:1;border-color:var(--encre)}
.form label{display:block;font-weight:700;margin:10px 0 4px;font-size:15px}
.form input,.form select{width:100%;height:48px;border:2px solid var(--ligne);border-radius:12px;padding:0 12px;background:#fff}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.timebig{display:flex;gap:10px;align-items:center;justify-content:center;font-size:30px;margin:10px 0}
.timebig input{font-size:28px;height:64px;border:2px solid var(--ligne);border-radius:14px;padding:0 10px;font-weight:700}
.modal-actions{display:flex;gap:10px;margin-top:16px}
.modal-actions button{flex:1}
.btn2{background:var(--fond);border-radius:14px;padding:14px;font-size:20px;font-weight:700}
.legend{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;align-items:center;font-size:18px}
.legend .li{font-size:34px;text-align:center}

#toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%) translateY(-20px);background:var(--encre);color:#fff;padding:12px 20px;border-radius:14px;font-size:18px;font-weight:700;opacity:0;transition:.25s;z-index:60;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.loading{display:grid;place-items:center;min-height:60vh;font-size:40px}
.spin{animation:spin 1s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}


/* ---------- Pointage ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.tile{background:#fff;border-radius:20px;padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;border:3px solid transparent;box-shadow:0 2px 8px rgba(15,63,80,.08);position:relative;min-height:150px;justify-content:center}
.tile:hover{border-color:var(--bleu)}
.tile:active{transform:scale(.97)}
.tile .tl-ico{font-size:46px;line-height:1}
.tile b{font-size:18px;line-height:1.2}
.tile .tl-time{color:var(--gris);font-size:15px;display:flex;gap:4px;align-items:center}
.tile.some{border-color:var(--ok)}
.tl-count{position:absolute;top:8px;right:8px;background:var(--ok);color:#fff;border-radius:999px;padding:2px 10px;font-weight:700;font-size:15px}
.calm{background:#fff;border-radius:20px;padding:24px;text-align:center;color:var(--gris);font-size:19px;margin-bottom:18px}
.calm span{display:block;font-size:44px}
.sec{font-size:17px;color:var(--gris);margin:6px 4px 8px}
.list{margin-bottom:8px}
.lrow{box-sizing:border-box;cursor:pointer;width:100%;display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:10px 12px;margin-bottom:6px;text-align:left;font-size:17px}
.lrow:hover{background:var(--bleu-c)}
.lrow .lt{font-weight:700;color:var(--bleu-f);min-width:50px}
.lrow .li{font-size:24px}
.lrow .ln{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .ln small{display:block;color:var(--gris);font-size:14px}
.lrow .lr{font-weight:700;white-space:nowrap}
.lrow.miss{border-left:6px solid var(--att)}
.lrow.done{border-left:6px solid var(--ok)}
.lrow.abs{border-left:6px solid var(--ko);opacity:.8}
details.grp{margin-bottom:12px}
details.grp summary{cursor:pointer;list-style:none;font-weight:700;font-size:17px;padding:12px 14px;border-radius:14px;background:#fff;margin-bottom:6px}
details.grp summary::-webkit-details-marker{display:none}
details.grp.miss summary{background:var(--att-c);color:#7a4f00}
details.grp.ok summary{background:var(--ok-c);color:var(--ok)}
.wz-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.wz-who{flex:1;display:flex;align-items:center;gap:10px;min-width:0}
.wz-who .wi{font-size:36px}
.wz-who b{display:block;font-size:19px}
.wz-who small{color:var(--gris)}
.absbtn{display:flex;flex-direction:column;align-items:center;font-size:22px;background:var(--ko-c);border-radius:12px;padding:4px 10px;color:var(--ko)}
.absbtn small{font-size:12px;font-weight:700}
.wz-dots{display:flex;gap:6px;justify-content:center;margin-bottom:12px}
.wz-dots button{width:34px;height:8px;border-radius:4px;background:var(--ligne)}
.wz-dots button.done{background:var(--bleu)}
.wz-dots button.on{background:var(--vert)}
.wz-q{font-size:24px;text-align:center;margin:6px 0 14px}
.namegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:10px}
.pick.name{min-height:60px;font-size:17px;flex-direction:row}
.numdisp{font-size:56px;font-weight:700;text-align:center;border:3px solid var(--ligne);border-radius:18px;padding:6px;margin:0 auto 12px;max-width:260px;min-height:84px}
.numdisp .ph{color:#c3cfd3}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:340px;margin:0 auto}
.keypad button{height:68px;border-radius:16px;background:var(--bleu-c);font-size:30px;font-weight:700;color:var(--bleu-f)}
.keypad button:active{background:var(--bleu);color:#fff}
.keypad .kpok{background:var(--ok);color:#fff}
.tlab{font-weight:700;font-size:18px;margin:12px 0 6px}
.tsel{display:flex;align-items:center;gap:8px;justify-content:center}
.tsel button{width:64px;height:60px;border-radius:14px;background:var(--bleu-c);font-weight:700;font-size:18px;color:var(--bleu-f)}
.tsel input{font-size:30px;font-weight:700;height:60px;border:3px solid var(--ligne);border-radius:14px;padding:0 10px;text-align:center;width:170px}
.chiprow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0}
.qchip{border:2px solid var(--ligne);border-radius:999px;padding:8px 14px;font-weight:700;background:#fff}
.qchip.on{background:var(--bleu);color:#fff;border-color:var(--bleu)}
.extra{display:flex;gap:10px;align-items:center;margin-top:14px}
.extra .field{flex:1;margin:0}
.extra .field input{font-size:18px}
.wz-more{display:flex;gap:10px;margin-top:10px}
.wz-more button{flex:1}
/* ---------- Pictogrammes ---------- */
.ic{width:1.15em;height:1.15em;fill:currentColor;vertical-align:-0.2em;flex:none;display:inline-block}
.chip{background:var(--bleu-c);color:var(--bleu-f)}
.chip .ci{font-size:16px;display:inline-flex}
.sic{color:var(--gris);font-size:17px;display:inline-flex}
.pick .pi{color:var(--bleu)}
.salle-pick{color:var(--encre);background:#fff;border-color:var(--ligne);opacity:1}
.salle-pick.on{background:var(--bleu);color:#fff;border-color:var(--bleu)}
.salle-pick.on .pi,.pick.on .pi{color:inherit}
.pick.on{color:var(--bleu-f)}
.tile .tl-ico{color:var(--bleu)}
.tile .tl-count .ic{fill:#fff}
.lrow .li{color:var(--bleu);display:inline-flex}
.lrow.miss .lr{color:var(--att)}
.lrow.abs .lr{color:var(--ko)}
.lrow.done .lr .ic{color:var(--bleu)}
.sum .ic{color:var(--bleu)}
.dayhead h2 .ic,.toolbar h2 .ic,.box h3 .ic{color:var(--bleu)}
.legend .li{color:var(--bleu)}
.kpi .kl .ic{color:var(--bleu)}
.calm span,.empty .ei{color:var(--ligne)}
.wz-who .wi{color:var(--bleu);display:inline-flex}
.wz-q .ic,.tlab .ic{color:var(--bleu)}
.field .fi{color:var(--gris);display:inline-flex}
.idbox .ic{color:var(--bleu)}
.note .ni{color:#7a4f00;display:inline-flex}
.match .ic{color:var(--att)}
.match{filter:none}
.match:not(.on) .ic{color:var(--gris)}
.qchip .ic{color:var(--bleu)} .qchip.on .ic{color:#fff}
.row-actions .tool .ic,.tool .ic{color:var(--bleu-f)}
td .ic{color:var(--bleu)}
.badge .ic{color:inherit}
.navbtn{color:var(--bleu);display:inline-grid;place-items:center}
.keypad button .ic{color:inherit}
.spin .ic{color:var(--bleu)}
@media (max-width:480px){.h-cx{display:none}.h-title small{display:none}.h-user span{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{
  .copy{padding:8px 0}
  header.top,nav.tabs,.fab,.noprint,.demo{display:none!important}
  body{background:#fff;font-size:12px}
  main{padding:0;max-width:none}
  .box,.kpi{break-inside:avoid;border:1px solid #ccc}
}
</style>

const parseYmd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const dow = d => (d.getDay()+6)%7+1;                  // 1 = lundi … 7 = dimanche
const mondayOf = d => addDays(d, 1-dow(d));

const nf = n => (Math.round(n*10)/10).toLocaleString('fr-FR');

function toast(t){ const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(()=>el.classList.remove('show'), 2200); }
function shake(el){ if(!el) return; el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
function errMsg(e){
  const c = e?.code || e?.message || String(e);
  if (c.includes('wrong-password') || c.includes('invalid-credential') || c==='mdp') return 'Mot de passe incorrect';
  if (c.includes('too-many-requests')) return 'Trop d’essais, patientez quelques minutes';
  if (c.includes('weak-password')) return 'Mot de passe trop court (6 caractères minimum)';
  if (c.includes('permission')) return 'Action non autorisée';
  if (c.includes('network') || c.includes('unavailable')) return 'Pas de connexion internet';
  if (c==='inconnu') return 'Identifiant inconnu';
  return c;
}
async function sha(s){ const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }

let offlineFlag = false;
const LocalStore = {
  mode:'local',
  _all(c){ try { return JSON.parse(localStorage.getItem('ydm_'+c) || '{}'); } catch(e){ return {}; } },
  _save(c,o){ localStorage.setItem('ydm_'+c, JSON.stringify(o)); },
  async get(c,id){ const o = this._all(c); return o[id] ? {id, ...o[id]} : null; },
  async list(c){ return Object.entries(this._all(c)).map(([id,v]) => ({id, ...v})); },
  async set(c,id,d){ const o = this._all(c); o[id] = d; this._save(c,o); },
  async update(c,id,d){ const o = this._all(c); o[id] = {...(o[id]||{}), ...d}; this._save(c,o); },
  async del(c,id){ const o = this._all(c); delete o[id]; this._save(c,o); },
  async batchSet(c,items){ const o = this._all(c); items.forEach(([id,d]) => o[id] = d); this._save(c,o); },
  async saisies(from,to){ return (await this.list('saisies')).filter(s => s.date >= from && s.date <= to); },
  async isInit(){ return !!this._all('config').app; },
  async bootstrap(nom){
    await this.set('config','app',{initialise:true, ouverture:'08:00', fermeture:'22:00'});
    await this.set('users',ADMIN_ID,{nom, role:'admin', version:1, needsPassword:true, uid:null, actif:true});
  },
  async signIn(id,pwd){ const u = await this.get('users',id); if(!u) throw new Error('inconnu'); if(u.pwdHash !== await sha(id+'|'+pwd)) throw new Error('mdp'); localStorage.setItem('ydm_session',id); },
  async firstPassword(id,pwd){ await this.update('users',id,{pwdHash: await sha(id+'|'+pwd), needsPassword:false, uid:'local-'+id}); localStorage.setItem('ydm_session',id); },
  async resetUser(id){ const u = await this.get('users',id); await this.update('users',id,{needsPassword:true, uid:null, pwdHash:null, version:(u.version||1)+1}); },
  async currentId(){ return localStorage.getItem('ydm_session'); },
  uid(id){ return 'local-'+id; },
  async signOut(){ localStorage.removeItem('ydm_session'); }
};

   ===================================================================== */
async function initFirebase(){
  const V = '10.12.2', B = `https://www.gstatic.com/firebasejs/${V}/`;
  const [appM, au, fs] = await Promise.all([import(B+'firebase-app.js'), import(B+'firebase-auth.js'), import(B+'firebase-firestore.js')]);
  const app = appM.initializeApp(firebaseConfig);
  const auth = au.getAuth(app);
  let db;
  try { db = fs.initializeFirestore(app, {localCache: fs.persistentLocalCache({tabManager: fs.persistentMultipleTabManager()})}); }
  catch(e){ db = fs.getFirestore(app); }
  let ready; const authReady = new Promise(r => ready = r);
  au.onAuthStateChanged(auth, () => ready());
  const email = (id,v) => `${id}__v${v}@${DOMAINE}`;
  // Une écriture hors ligne reste en attente : on n'attend pas plus de 4 s (elle partira au retour du réseau)
  const wt = p => Promise.race([p.then(()=>{ offlineFlag = false; }), new Promise(r => setTimeout(()=>{ offlineFlag = true; r(); }, 4000))]);
  const D = (c,id) => fs.doc(db,c,id);
  return {
    mode:'firebase',
    async get(c,id){ const s = await fs.getDoc(D(c,id)); return s.exists() ? {id:s.id, ...s.data()} : null; },
    async list(c){ const s = await fs.getDocs(fs.collection(db,c)); return s.docs.map(d => ({id:d.id, ...d.data()})); },
    async set(c,id,d){ await wt(fs.setDoc(D(c,id), d)); },
    async update(c,id,d){ await wt(fs.updateDoc(D(c,id), d)); },
    async del(c,id){ await wt(fs.deleteDoc(D(c,id))); },
    async batchSet(c,items){
      for (let i=0; i<items.length; i+=400){ const b = fs.writeBatch(db); items.slice(i,i+400).forEach(([id,d]) => b.set(D(c,id), d)); await b.commit(); }
    },
    async saisies(from,to){
      const q = fs.query(fs.collection(db,'saisies'), fs.where('date','>=',from), fs.where('date','<=',to));
      const s = await fs.getDocs(q); return s.docs.map(d => ({id:d.id, ...d.data()}));
    },
    async isInit(){ return !!(await this.get('config','app')); },
    async bootstrap(nom){
      const b = fs.writeBatch(db);
      b.set(D('config','app'), {initialise:true, ouverture:'08:00', fermeture:'22:00'});
      b.set(D('users',ADMIN_ID), {nom, role:'admin', version:1, needsPassword:true, uid:null, actif:true});
      await b.commit();
    },
    async signIn(id,pwd){
      const u = await this.get('users',id); if(!u) throw new Error('inconnu');
      await au.signInWithEmailAndPassword(auth, email(id,u.version||1), pwd);
    },
    async firstPassword(id,pwd){
      const u = await this.get('users',id); const e = email(id,u.version||1); let cred;
      try { cred = await au.createUserWithEmailAndPassword(auth, e, pwd); }
      catch(err){ if (err.code === 'auth/email-already-in-use') cred = await au.signInWithEmailAndPassword(auth, e, pwd); else throw err; }
      await fs.updateDoc(D('users',id), {uid:cred.user.uid, needsPassword:false});
    },
    async resetUser(id){ const u = await this.get('users',id); await this.update('users',id,{version:(u.version||1)+1, needsPassword:true, uid:null}); },
    async currentId(){ await authReady; const us = auth.currentUser; return us && us.email ? us.email.split('@')[0].split('__v')[0] : null; },
    uid(){ return auth.currentUser?.uid; },
    async signOut(){ await au.signOut(auth); }
  };
}

const isScol = t => (t||'').startsWith('Scolaire');
const nowMin = () => { const d = new Date(); return d.getHours()*60 + d.getMinutes(); };
const hm = m => { m = Math.max(0, Math.min(23*60+55, Math.round(m))); return `${pad(Math.floor(m/60))}:${pad(m%60)}`; };
const nowQ = () => hm(Math.floor(nowMin()/15)*15);
const dots = ids => (ids||[]).map(id => `<span class="sic" title="${SALLE[id]?.court||''}">${SALLE[id]?.ico||''}</span>`).join('');
const dayEditable = d => isAdmin() || d === todayStr();

function dayModel(d, sais){
  const dj = dow(parseYmd(d)); const used = new Set();
  const planned = S.planning.filter(p => p.jour === dj && p.actif !== false).map(p => {
    const st = struct(p.structureId);
    const ss = sais.filter(s => s.planningId === p.id); ss.forEach(s => used.add(s.id));
    const pres = ss.filter(s => s.statut === 'present');
    return {p, st, sais:ss, pres, absent: !pres.length && ss.some(s => s.statut === 'absent')};
  }).sort((a,b) => mins(a.p.debut) - mins(b.p.debut));
  return {planned, extra: sais.filter(s => !used.has(s.id))};
}

async function viewJour(){
  const d = isAdmin() ? S.date : todayStr();
  const sais = await S.store.saisies(d, d);
  S.daySais = sais; S.curDate = d;
  const M = dayModel(d, sais); S.dayModel = M;
  const today = todayStr(), isToday = d === today, nm = nowMin();
  const now = [], later = [], missed = [];
  M.planned.forEach(x => {
    const scol = isScol(x.st?.type);
    if (x.absent || (!scol && x.pres.length)) return;          // déjà traité
    const a = mins(x.p.debut) - 60, b = mins(x.p.fin) + 30;
    if (d > today || (isToday && nm < a)) later.push(x);
    else if (isToday && nm <= b) now.push(x);
    else if (!x.pres.length) missed.push(x);
  });
  const fait = [...sais].sort((a,b) => mins(a.debut) - mins(b.debut));
  const total = sais.filter(s => s.statut === 'present').reduce((a,s) => a + (+s.effectif||0), 0);
  const nav = isAdmin() ? `
      <button class="navbtn" data-act="dayShift" data-n="-1" aria-label="Jour précédent">◀</button>
      <input type="date" class="datein" value="${d}" data-on="dayPick">
      <button class="navbtn" data-act="dayShift" data-n="1" aria-label="Jour suivant">▶</button>
      ${!isToday ? '<button class="pill light" data-act="dayToday">Aujourd’hui</button>' : ''}` : '';
  const rowP = (x, cls='') => `<div role="button" tabindex="0" class="lrow ${cls}" data-act="point" data-pid="${x.p.id}">
      <span class="lt">${x.p.debut}</span><span class="li">${actIco(x.st?.activite)}</span>
      <span class="ln">${esc(x.st?.nom || '?')}</span>${dots(x.p.salles)}<span class="lr">${cls === 'miss' ? '⏳' : '➜'}</span></div>`;
  const rowS = s => `<div role="button" tabindex="0" class="lrow ${s.statut === 'absent' ? 'abs' : 'done'}" data-act="editS" data-sid="${s.id}">
      <span class="lt">${s.debut}</span><span class="li">${actIco(s.activite)}</span>
      <span class="ln">${esc(s.structureNom)}${s.enseignant ? `<small>👤 ${esc(s.enseignant)}</small>` : ''}</span>${dots(s.salles)}
      <span class="lr">${s.statut === 'absent' ? '❌' : '👥 ' + s.effectif}</span></div>`;
  const tile = x => `<button class="tile ${x.pres.length ? 'some' : ''}" data-act="point" data-pid="${x.p.id}">
      <span class="tl-ico">${actIco(x.st?.activite)}</span><b>${esc(x.st?.nom || '?')}</b>
      <span class="tl-time">${isScol(x.st?.type) ? '' : x.p.debut + ' ' }${dots(x.p.salles)}</span>
      ${x.pres.length ? `<span class="tl-count">✅ ${x.pres.length}</span>` : ''}</button>`;

  let h = `<div class="dayhead"><h2>📅 ${fmtLong(d)}</h2>${nav}<div class="sum">👥 ${total}</div></div>`;
  if (isToday) h += now.length
    ? `<div class="tiles">${now.map(tile).join('')}</div>`
    : `<div class="calm"><span>😌</span>Personne n’est attendu maintenant</div>`;
  if (missed.length) h += `<details class="grp miss" ${isToday ? '' : 'open'}><summary>⏳ ${missed.length} à pointer</summary>${missed.map(x => rowP(x,'miss')).join('')}</details>`;
  if (later.length) h += `<h3 class="sec">🕒 ${isToday ? 'Plus tard' : 'Prévu'}</h3><div class="list">${later.slice(0,3).map(x => rowP(x)).join('')}</div>
      ${later.length > 3 ? `<details class="grp"><summary>▼ ${later.length-3} autres</summary>${later.slice(3).map(x => rowP(x)).join('')}</details>` : ''}`;
  if (fait.length) h += `<details class="grp ok" ${isToday ? '' : 'open'}><summary>✅ Fait (${fait.length})</summary>${fait.map(rowS).join('')}</details>`;
  if (!M.planned.length && !sais.length) h += `<div class="empty"><span class="ei">🗓️</span>Aucun groupe prévu.<br>➕ pour ajouter un groupe.</div>`;
  h += `<button class="fab" data-act="addNew" aria-label="Ajouter un groupe">➕</button>`;
  $('#main').innerHTML = h;
}

function wzValid(step){
  if (step === 'salle' && !W.salles.length) { shake(document.querySelector('.modal-box .pickgrid')); return false; }
  if (step === 'nb' && !(+W.effectif > 0)) { shake($('#numd')); return false; }
  return true;
}
function wzNext(){ if (!wzValid(W.steps[W.step])) return; if (W.step < W.steps.length-1) { W.step++; renderWz(); } }
ACT.wzNext = wzNext;
ACT.wzBack = () => { W.step = Math.max(0, W.step-1); renderWz(); };

ACT.wzStruct = el => {

  Object.assign(W, {structureId:id, nom:st.nom, activite:st.activite, baseType:st.type, autre:false});
  // rattache au créneau prévu le plus proche de l'heure actuelle pour cette structure
  const c = S.dayModel.planned.filter(x => x.p.structureId === id && !x.absent && (isScol(st.type) || !x.pres.length))
    .sort((a,b) => Math.abs(mins(a.p.debut)-nowMin()) - Math.abs(mins(b.p.debut)-nowMin()))[0];
  if (c) { const f = wzFromPlanned(c); Object.assign(W, {planningId:f.planningId, salles:f.salles, pDeb:f.pDeb, pFin:f.pFin, match:f.match});
    if (!isScol(st.type)) Object.assign(W, {debut:f.debut, fin:f.fin}); }
  W.steps = stepsFor(true); W.step = 1; renderWz();
};

function kp(k){
  let v = String(W.effectif);
  if (k === 'del') v = v.slice(0,-1); else if (v.length < 4) v = (v === '0' ? '' : v) + k;

function setT(w, v){

async function wzWrite(data){

}

async function viewSemaine(){
  const ref = isAdmin() ? parseYmd(S.weekRef) : new Date();
  const mon = mondayOf(ref), sun = addDays(mon,6);
  const sais = await S.store.saisies(ymd(mon), ymd(sun));
  const today = todayStr();
  const days = [...Array(7)].map((_,i) => {
    const d = ymd(addDays(mon,i)), ss = sais.filter(s => s.date === d), M = dayModel(d, ss), rows = [];
    M.planned.forEach(x => { if (!x.sais.length) rows.push({t:x.p.debut, nom:x.st?.nom || '?', act:x.st?.activite, salles:x.p.salles,
      e: d < today ? '<span style="color:var(--att)">⏳</span>' : '·'}); });
    ss.forEach(s => rows.push({t:s.debut, nom:s.structureNom + (s.enseignant ? ' – ' + s.enseignant : ''), act:s.activite, salles:s.salles,
      e: s.statut === 'present' ? `👥 ${s.effectif}` : '❌'}));
    rows.sort((a,b) => mins(a.t) - mins(b.t));
    return {d, rows, tot: ss.filter(s => s.statut === 'present').reduce((a,s) => a + (+s.effectif||0), 0)};
  });
  const wtot = days.reduce((a,x) => a + x.tot, 0);

  $('#main').innerHTML = `<div class="dayhead"><h2>📅 ${mon.toLocaleDateString('fr-FR',{day:'numeric',month:'short'})} – ${sun.toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'})}</h2>${nav}
      <div class="sum">👥 ${wtot}</div></div>

function synRange(){
  const r = parseYmd(S.syn.ref), p = S.syn.per;
  if (p === 'jour') return [S.syn.ref, S.syn.ref, fmtLong(S.syn.ref)];
  if (p === 'semaine') { const m = mondayOf(r); return [ymd(m), ymd(addDays(m,6)), `Semaine du ${m.toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'})}`]; }
  if (p === 'mois') { const a = new Date(r.getFullYear(), r.getMonth(), 1), b = new Date(r.getFullYear(), r.getMonth()+1, 0); return [ymd(a), ymd(b), a.toLocaleDateString('fr-FR',{month:'long',year:'numeric'})]; }
  if (p === 'annee') return [`${r.getFullYear()}-01-01`, `${r.getFullYear()}-12-31`, `Année ${r.getFullYear()}`];
  if (p === 'saison') { const y = r.getMonth() >= 8 ? r.getFullYear() : r.getFullYear()-1; return [`${y}-09-01`, `${y+1}-08-31`, `Saison ${y}-${y+1}`]; }
  return [S.syn.from, S.syn.to, `Du ${fmtCourt(S.syn.from)} au ${fmtCourt(S.syn.to)}`];
}
function shiftRef(n){
  const r = parseYmd(S.syn.ref), p = S.syn.per;
  if (p === 'jour') S.syn.ref = ymd(addDays(r,n));
  else if (p === 'semaine') S.syn.ref = ymd(addDays(r,7*n));
  else if (p === 'mois') S.syn.ref = ymd(new Date(r.getFullYear(), r.getMonth()+n, 1));
  else S.syn.ref = ymd(new Date(r.getFullYear()+n, r.getMonth(), 1));
}
function agg(map, key, add){ const o = map.get(key) || {cr:0, abs:0, h:0, p:0}; add(o); map.set(key, o); }

async function viewSynthese(){
  const [from, to, label] = synRange();
  const sais = await S.store.saisies(from, to);
  const pres = sais.filter(s => s.statut === 'present');
  const nbJours = Math.round((parseYmd(to) - parseYmd(from)) / 864e5) + 1;
  const ampl = dureeH(S.config.ouverture || '08:00', S.config.fermeture || '22:00');

  // Créneaux prévus non renseignés (jours passés et aujourd'hui)
  const today = todayStr(); let nonRens = 0;
  const done = new Set(sais.filter(s => s.planningId).map(s => s.date+'|'+s.planningId));
  for (let d = parseYmd(from); ymd(d) <= to && ymd(d) <= today; d = addDays(d,1)) {
    const ds = ymd(d), dj = dow(d);
    S.planning.forEach(p => { if (p.jour === dj && p.actif !== false && !done.has(ds+'|'+p.id)) nonRens++; });
  }

  const total = pres.reduce((a,s) => a+s.effectif, 0);
  const hEntries = pres.reduce((a,s) => a+dureeH(s.debut,s.fin), 0);
  const bySalle = new Map(), byType = new Map(), byAct = new Map(), byStr = new Map(), byEns = new Map(), heat = new Map();
  let hSalles = 0;
  sais.forEach(s => {
    const h = dureeH(s.debut, s.fin), ok = s.statut === 'present';
    const sk = s.structureNom;
    agg(byStr, sk, o => { o.type = s.type; if (ok) { o.cr++; o.h += h; o.p += s.effectif; } else o.abs++; });
    if (!ok) return;
    agg(byType, s.type, o => { o.cr++; o.h += h; o.p += s.effectif; });
    agg(byAct, s.activite || 'Autre', o => { o.cr++; o.h += h; o.p += s.effectif; });
    if (s.enseignant) agg(byEns, s.structureNom + '|' + s.enseignant, o => { o.cr++; o.h += h; o.p += s.effectif; });
    const n = (s.salles||[]).length || 1;
    (s.salles||[]).forEach(id => {
      hSalles += h;
      agg(bySalle, id, o => { o.cr++; o.h += h; o.p += s.effectif / n; });
      const k = (s.jourSemaine || dow(parseYmd(s.date))) + '|' + id; heat.set(k, (heat.get(k)||0) + h);
    });
  });
  const tauxGlobal = hSalles / (SALLES.length * ampl * nbJours) * 100;
  const maxP = Math.max(1, ...[...byType.values()].map(o => o.p));
  const maxA = Math.max(1, ...[...byAct.values()].map(o => o.p));
  const nbJS = j => { let c = 0; for (let d = parseYmd(from); ymd(d) <= to; d = addDays(d,1)) if (dow(d) === j) c++; return c; };
  const maxHeat = Math.max(1, ...heat.values());
  S.synData = {sais, label, from, to, bySalle, byType, byAct, byStr, byEns, nbJours, ampl};

  const bar = (v,m,c='var(--bleu)') => `<div class="bar"><i style="width:${Math.min(100, v/m*100)}%;background:${c}"></i></div>`;
  $('#main').innerHTML = `
    <div class="toolbar noprint">
      <div class="seg">${[['jour','Jour'],['semaine','Semaine'],['mois','Mois'],['annee','Année'],['saison','Saison'],['perso','Période']].map(([k,l]) => `<button class="${S.syn.per===k?'on':''}" data-act="synPer" data-p="${k}">${l}</button>`).join('')}</div>
      ${S.syn.per === 'perso'
        ? `<input type="date" class="datein" value="${S.syn.from}" data-on="synFrom"> ➜ <input type="date" class="datein" value="${S.syn.to}" data-on="synTo">`
        : `<button class="navbtn" data-act="synShift" data-n="-1" aria-label="Précédent">◀</button><button class="navbtn" data-act="synShift" data-n="1" aria-label="Suivant">▶</button><button class="pill light" data-act="synNow">Aujourd’hui</button>`}
    </div>
    <div class="toolbar"><h2 style="text-transform:capitalize">📊 ${esc(label)}</h2>
      <div class="noprint" style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="pill" data-act="expDetail">⬇️ Détail (Excel)</button>
        <button class="pill" data-act="expSynth">⬇️ Synthèse (Excel)</button>
        <button class="pill light" data-act="print">🖨️ Imprimer / PDF</button></div></div>
    <div class="kpis">
      <div class="kpi"><div class="kv">${total.toLocaleString('fr-FR')}</div><div class="kl">👥 Pratiquants (passages)</div></div>
      <div class="kpi"><div class="kv">${pres.length}</div><div class="kl">✅ Créneaux réalisés</div></div>
      <div class="kpi"><div class="kv">${nf(hEntries)} h</div><div class="kl">⏱️ Heures d’activité</div></div>
      <div class="kpi"><div class="kv">${nf(tauxGlobal)} %</div><div class="kl">📈 Taux d’occupation moyen (${S.config.ouverture}–${S.config.fermeture})</div></div>
      <div class="kpi"><div class="kv">${sais.length - pres.length}</div><div class="kl">❌ Absences / annulations</div></div>
      <div class="kpi ${nonRens?'alert':''}"><div class="kv">${nonRens}</div><div class="kl">⏳ Créneaux prévus non renseignés</div></div>
    </div>
    <div class="box" id="chartbox"><h3>Évolution de la fréquentation (pratiquants par type de public)</h3><div class="chartwrap"><canvas id="chart"></canvas></div></div>
    <div class="box"><h3>Par installation</h3><div class="tw"><table>
      <tr><th>Installation</th><th class="n">Créneaux</th><th class="n">Heures</th><th>Taux d’occupation</th><th class="n">Pratiquants*</th></tr>
      ${SALLES.map(s => { const o = bySalle.get(s.id) || {cr:0,h:0,p:0}; const t = o.h/(ampl*nbJours)*100;
        return `<tr><td>${chip(s.id)} ${s.nom}</td><td class="n">${o.cr}</td><td class="n">${nf(o.h)}</td><td>${bar(t,100)} ${nf(t)} %</td><td class="n">${Math.round(o.p).toLocaleString('fr-FR')}</td></tr>`; }).join('')}
    </table></div><p style="font-size:13px;color:var(--gris)">* Un groupe réparti sur plusieurs salles est compté une fois au total : son effectif est partagé à parts égales entre les salles utilisées.</p></div>
    <div class="grid2">
      <div class="box"><h3>Par type de public</h3><div class="tw"><table>
        <tr><th>Type</th><th class="n">Créneaux</th><th class="n">Heures</th><th class="n">Pratiquants</th><th>Part</th></tr>
        ${TYPES.map(t => { const o = byType.get(t) || {cr:0,h:0,p:0};
          return `<tr><td>${TYPE_ICO[t]} ${t}</td><td class="n">${o.cr}</td><td class="n">${nf(o.h)}</td><td class="n">${o.p.toLocaleString('fr-FR')}</td><td>${bar(o.p,maxP,TYPE_COL[t])} ${total ? nf(o.p/total*100) : 0} %</td></tr>`; }).join('')}
        <tr><th>Total</th><th class="n">${pres.length}</th><th class="n">${nf(hEntries)}</th><th class="n">${total.toLocaleString('fr-FR')}</th><th></th></tr>
      </table></div></div>
      <div class="box"><h3>Par activité</h3><div class="tw"><table>
        <tr><th>Activité</th><th class="n">Créneaux</th><th class="n">Heures</th><th class="n">Pratiquants</th><th></th></tr>
        ${[...byAct.entries()].sort((a,b) => b[1].p - a[1].p).map(([a,o]) => `<tr><td>${actIco(a)} ${esc(a)}</td><td class="n">${o.cr}</td><td class="n">${nf(o.h)}</td><td class="n">${o.p.toLocaleString('fr-FR')}</td><td>${bar(o.p,maxA)}</td></tr>`).join('') || '<tr><td colspan="5">—</td></tr>'}
      </table></div></div>
    </div>
    <div class="box"><h3>Heures d’occupation par jour de la semaine et par installation</h3><div class="tw"><table class="heat">
      <tr><th></th>${SALLES.map(s => `<th style="text-align:center">${s.ico}<br>${s.court}</th>`).join('')}</tr>
      ${JOURS.map((j,i) => `<tr><th>${j}</th>${SALLES.map(s => { const h = heat.get((i+1)+'|'+s.id) || 0; const a = h/maxHeat;
        return `<td style="background:rgba(25,93,116,${(a*0.85).toFixed(2)});color:${a>0.5?'#fff':'var(--encre)'}">${h ? nf(h/Math.max(1,nbJS(i+1))) : ''}</td>`; }).join('')}</tr>`).join('')}
    </table></div><p style="font-size:13px;color:var(--gris)">Moyenne d’heures par jour concerné sur la période.</p></div>
    <div class="box"><h3>Par structure</h3><div class="tw"><table>
      <tr><th>Structure</th><th>Type</th><th class="n">Créneaux</th><th class="n">Absences</th><th class="n">Heures</th><th class="n">Pratiquants</th><th class="n">Moyenne / créneau</th></tr>
      ${[...byStr.entries()].sort((a,b) => b[1].p - a[1].p).map(([n,o]) => `<tr><td>${esc(n)}</td><td>${TYPE_ICO[o.type]||''} ${esc(o.type||'')}</td><td class="n">${o.cr}</td><td class="n">${o.abs ? `<span class="badge b-ko">${o.abs}</span>` : 0}</td><td class="n">${nf(o.h)}</td><td class="n">${o.p.toLocaleString('fr-FR')}</td><td class="n">${o.cr ? nf(o.p/o.cr) : '—'}</td></tr>`).join('') || '<tr><td colspan="7">—</td></tr>'}
    </table></div></div>

      <tr><th>Structure</th><th>Enseignant / responsable</th><th class="n">Créneaux</th><th class="n">Heures</th><th class="n">Pratiquants</th><th class="n">Moyenne / créneau</th></tr>
      ${[...byEns.entries()].sort((a,b) => a[0].localeCompare(b[0],'fr')).map(([k,o]) => { const [st,en] = k.split('|'); return `<tr><td>${esc(st)}</td><td>👤 ${esc(en)}</td><td class="n">${o.cr}</td><td class="n">${nf(o.h)}</td><td class="n">${o.p.toLocaleString('fr-FR')}</td><td class="n">${nf(o.p/o.cr)}</td></tr>`; }).join('') || '<tr><td colspan="6">—</td></tr>'}
    </table></div></div>`;
  drawChart(pres, from, to);
}
function drawChart(pres, from, to){
  if (!window.Chart) { $('#chartbox')?.remove(); return; }
  const days = Math.round((parseYmd(to) - parseYmd(from)) / 864e5) + 1;
  const labels = [], keys = [];
  if (days <= 62) { for (let d = parseYmd(from); ymd(d) <= to; d = addDays(d,1)) { keys.push(ymd(d)); labels.push(d.toLocaleDateString('fr-FR',{weekday:'short',day:'numeric'})); } }
  else { for (let d = parseYmd(from.slice(0,7)+'-01'); ymd(d) <= to; d = new Date(d.getFullYear(), d.getMonth()+1, 1)) { keys.push(ymd(d).slice(0,7)); labels.push(d.toLocaleDateString('fr-FR',{month:'short',year:'2-digit'})); } }
  const k = s => days <= 62 ? s.date : s.date.slice(0,7);
  const datasets = TYPES.map(t => ({label:t, backgroundColor:TYPE_COL[t], data: keys.map(key => pres.filter(s => s.type === t && k(s) === key).reduce((a,s) => a+s.effectif, 0))}))
    .filter(ds => ds.data.some(v => v > 0));
  chartObj = new Chart($('#chart'), {type:'bar', data:{labels, datasets},
    options:{maintainAspectRatio:false, responsive:true, scales:{x:{stacked:true}, y:{stacked:true, beginAtZero:true}}, plugins:{legend:{position:'bottom', labels:{boxWidth:12}}}}});
}

function downloadCSV(name, rows){
  const csv = '\uFEFF' + rows.map(r => r.map(c => { const s = String(c ?? ''); return /[;"\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; }).join(';')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'})); a.download = name; document.body.appendChild(a); a.click(); a.remove();
}
const dec = n => String(Math.round(n*100)/100).replace('.', ',');

    <div class="daytabs">${JOURS.map((j,i) => `<button class="${S.planDay===i+1?'on':''}" data-act="planDay" data-d="${i+1}">${j.slice(0,3)}</button>`).join('')}</div>
    <div class="box"><h3>${JOURS[S.planDay-1]} – ${list.length} créneau(x)</h3><div class="tw"><table>
      <tr><th>Horaire</th><th>Structure</th><th>Installations</th><th>Statut</th><th></th></tr>
      ${list.map(p => { const st = struct(p.structureId); return `<tr>
        <td><b>${p.debut}–${p.fin}</b></td><td>${st ? actIco(st.activite)+' '+esc(st.nom) : '<span class="badge b-ko">Structure supprimée</span>'}${p.match?' 🏆':''}</td>
        <td>${(p.salles||[]).length ? p.salles.map(chip).join(' ') : '<span class="badge b-att">Choisie par l’agent</span>'}</td>
        <td>${p.actif === false ? '<span class="badge b-ko">Suspendu</span>' : '<span class="badge b-ok">Actif</span>'}</td>
        <td class="row-actions"><button class="tool" data-act="planEdit" data-id="${p.id}" aria-label="Modifier">✏️</button><button class="tool" data-act="planDel" data-id="${p.id}" aria-label="Supprimer">🗑️</button></td></tr>`; }).join('') || '<tr><td colspan="5">Aucun créneau ce jour.</td></tr>'}
    </table></div></div>`;
}
ACT.planDay = el => { S.planDay = +el.dataset.d; viewPlanning(); };
ACT.saveConfig = async () => {
  const o = $('#cfo').value, f = $('#cff').value; if (!o || !f || mins(f) <= mins(o)) return shake($('#cff'));
  try { await S.store.update('config','app',{ouverture:o, fermeture:f}); S.config.ouverture = o; S.config.fermeture = f; toast('✅ Enregistré'); } catch(e){ toast('❌ '+errMsg(e)); }
};
ACT.planEdit = el => {
  const p = S.planning.find(x => x.id === el.dataset.id) || {jour:S.planDay, structureId:'', salles:[], debut:'18:00', fin:'20:00', match:false, actif:true};
  selTmp = [...(p.salles||[])];
  openModal(`<h2>${p.id ? '✏️ Modifier' : '➕ Ajouter'} un créneau <button class="xbtn" data-act="closeModal">✕</button></h2>
    <div class="form">
      <label>Structure</label><select id="pf_s"><option value="">— choisir —</option>${S.structures.map(s => `<option value="${s.id}" ${s.id===p.structureId?'selected':''}>${esc(s.nom)}</option>`).join('')}</select>
      <div class="two"><div><label>Jour</label><select id="pf_j">${JOURS.map((j,i) => `<option value="${i+1}" ${p.jour===i+1?'selected':''}>${j}</option>`).join('')}</select></div>
        <div><label>Statut</label><select id="pf_a"><option value="1" ${p.actif!==false?'selected':''}>Actif</option><option value="0" ${p.actif===false?'selected':''}>Suspendu</option></select></div></div>
      <div class="two"><div><label>Début</label><input type="time" id="pf_d" value="${p.debut}"></div><div><label>Fin</label><input type="time" id="pf_f" value="${p.fin}"></div></div>
      <label>Installations (aucune = choisie par l’agent, ex. scolaires)</label>
      <div class="pickgrid">${SALLES.map(s => `<button class="pick salle-pick ${selTmp.includes(s.id)?'on':''}" data-act="tglSalle" data-id="${s.id}"><span class="pi">${s.ico}</span>${s.court}</button>`).join('')}</div>
      <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="pf_m" style="width:24px;height:24px" ${p.match?'checked':''}> 🏆 Match (rencontre sportive)</label>
    </div>
    <div class="modal-actions"><button class="btn2" data-act="closeModal">Annuler</button><button class="bigbtn" data-act="planSave" data-id="${p.id||''}">Enregistrer</button></div>`);
  ACT.tglSalle = b => { const id = b.dataset.id; selTmp = selTmp.includes(id) ? selTmp.filter(x => x !== id) : [...selTmp, id]; b.classList.toggle('on'); };
};
ACT.planSave = async el => {
  const data = { structureId:$('#pf_s').value, jour:+$('#pf_j').value, debut:$('#pf_d').value, fin:$('#pf_f').value,
    salles: SALLES.map(s=>s.id).filter(id => selTmp.includes(id)), match:$('#pf_m').checked, actif:$('#pf_a').value === '1' };
  if (!data.structureId) return shake($('#pf_s'));
  if (!data.debut || !data.fin || mins(data.fin) <= mins(data.debut)) return shake($('#pf_f'));
  const id = el.dataset.id || genId();
  try { await S.store.set('planning', id, data); const i = S.planning.findIndex(x => x.id === id); if (i >= 0) S.planning[i] = {id, ...data}; else S.planning.push({id, ...data});
    S.planDay = data.jour; closeModal(); toast('✅ Enregistré'); viewPlanning(); } catch(e){ toast('❌ '+errMsg(e)); }
};
ACT.planDel = async el => {
  if (!cf('Supprimer ce créneau du planning type ? (les saisies déjà faites sont conservées)')) return;
  try { await S.store.del('planning', el.dataset.id); S.planning = S.planning.filter(x => x.id !== el.dataset.id); toast('🗑️ Supprimé'); viewPlanning(); } catch(e){ toast('❌ '+errMsg(e)); }
};
function askImport(){
  openModal(`<h2>📥 Planning 2026-2027 <button class="xbtn" data-act="closeModal">✕</button></h2>
    <p>Importer les <b>${SEED_STRUCTURES.length} structures</b> et les <b>${SEED_PLANNING.trim().split('\n').length} créneaux hebdomadaires</b> repris du classeur de M. Tagoust (types corrigés, noms de salles harmonisés) ?</p>
    <p class="msg info">Les structures et créneaux existants portant le même code seront remplacés. Vous pourrez tout corriger ensuite dans les onglets 🗓️ et 🏢.</p>
    <div class="modal-actions"><button class="btn2" data-act="closeModal">Plus tard</button><button class="bigbtn" data-act="doImport">📥 Importer</button></div>`);
}
ACT.askImport = askImport;
ACT.doImport = async () => {
  try {
    await S.store.batchSet('structures', SEED_STRUCTURES.map(([id,nom,type,activite]) => [id, {nom, type, activite, actif:true}]));
    const pl = SEED_PLANNING.trim().split('\n').map((l,i) => { const [j,s,sa,d,f] = l.trim().split('|');
      return [`seed${pad(i+1)}`, {jour:+j, structureId:s, salles: sa ? sa.split(',') : [], debut:d, fin:f, match:false, actif:true}]; });
    await S.store.batchSet('planning', pl);
    await loadRefs(); closeModal(); toast('✅ Planning importé'); renderMain();
  } catch(e){ toast('❌ '+errMsg(e)); }
};

/* =====================================================================
   STRUCTURES (admin)
   ===================================================================== */
function viewStructures(){
  $('#main').innerHTML = `
    <div class="toolbar"><h2>🏢 Structures (${S.structures.length})</h2><button class="pill" data-act="strEdit">➕ Ajouter une structure</button></div>
    <div class="box"><div class="tw"><table>
      <tr><th></th><th>Nom</th><th>Type</th><th>Activité</th><th class="n">Créneaux / sem.</th><th>Statut</th><th></th></tr>
      ${S.structures.map(s => `<tr><td style="font-size:24px">${actIco(s.activite)}</td><td><b>${esc(s.nom)}</b></td><td>${TYPE_ICO[s.type]||''} ${esc(s.type)}</td><td>${esc(s.activite)}</td>
        <td class="n">${S.planning.filter(p => p.structureId === s.id).length}</td>
        <td>${s.actif === false ? '<span class="badge b-ko">Inactive</span>' : '<span class="badge b-ok">Active</span>'}</td>
        <td class="row-actions"><button class="tool" data-act="strEdit" data-id="${s.id}" aria-label="Modifier">✏️</button><button class="tool" data-act="strDel" data-id="${s.id}" aria-label="Supprimer">🗑️</button></td></tr>`).join('') || '<tr><td colspan="7">Aucune structure. Importez le planning depuis l’onglet 🗓️.</td></tr>'}
    </table></div></div>`;
}
ACT.strEdit = el => {
  const s = struct(el.dataset.id) || {nom:'', type:'CLUB entraînement', activite:'', actif:true};
  openModal(`<h2>${s.id ? '✏️ Modifier' : '➕ Ajouter'} <button class="xbtn" data-act="closeModal">✕</button></h2>
    <div class="form">
      <label>Nom</label><input id="sf_n" value="${esc(s.nom)}">
      <label>Type de public</label><select id="sf_t">${TYPES_STRUCT.map(t => `<option ${t===s.type?'selected':''}>${t}</option>`).join('')}</select>
      <label>Activité</label><input id="sf_a" list="actlist" value="${esc(s.activite)}"><datalist id="actlist">${Object.keys(ACTIVITES).map(a => `<option value="${a}">`).join('')}</datalist>
      <label>Statut</label><select id="sf_s"><option value="1" ${s.actif!==false?'selected':''}>Active</option><option value="0" ${s.actif===false?'selected':''}>Inactive</option></select>
      <label>Enseignants (scolaires) – un nom par ligne</label><textarea id="sf_e" rows="4" style="width:100%;border:2px solid var(--ligne);border-radius:12px;padding:8px 12px;font:inherit">${esc((S.ens[s.id]||[]).join('\n'))}</textarea>
      <p style="font-size:14px;color:var(--gris)">Les noms tapés par les agents s’ajoutent automatiquement à cette liste. Pour un club, le type « CLUB rencontre sportive » est appliqué automatiquement quand l’agent coche 🏆 Match.</p>
    </div>
    <div class="modal-actions"><button class="btn2" data-act="closeModal">Annuler</button><button class="bigbtn" data-act="strSave" data-id="${s.id||''}">Enregistrer</button></div>`);
};
ACT.strSave = async el => {
  const data = {nom:$('#sf_n').value.trim(), type:$('#sf_t').value, activite:$('#sf_a').value.trim() || 'Autre', actif:$('#sf_s').value === '1'};
  if (!data.nom) return shake($('#sf_n'));
  const id = el.dataset.id || genId();
  const noms = [...new Set($('#sf_e').value.split('\n').map(x => x.trim()).filter(Boolean))].sort((a,b) => a.localeCompare(b,'fr'));
  try { await S.store.set('structures', id, data); if (noms.length || S.ens[id]) await S.store.set('enseignants', id, {noms}); await loadRefs(); closeModal(); toast('✅ Enregistré'); viewStructures(); } catch(e){ toast('❌ '+errMsg(e)); }
};
ACT.strDel = async el => {
  const n = S.planning.filter(p => p.structureId === el.dataset.id).length;
  if (!cf(n ? `Cette structure a ${n} créneau(x) au planning. Supprimer quand même ? (Conseil : passez-la plutôt en « Inactive »)` : 'Supprimer cette structure ?')) return;
  try { await S.store.del('structures', el.dataset.id); await loadRefs(); toast('🗑️ Supprimé'); viewStructures(); } catch(e){ toast('❌ '+errMsg(e)); }
};

/* =====================================================================
   AGENTS (admin)
   ===================================================================== */
async function viewAgents(){
  const users = (await S.store.list('users')).sort((a,b) => (a.role === 'admin' ? -1 : 1) - (b.role === 'admin' ? -1 : 1) || a.id.localeCompare(b.id));
  $('#main').innerHTML = `
    <div class="toolbar"><h2>👤 Agents</h2><button class="pill" data-act="userNew">➕ Nouvel agent</button></div>
    <div class="box"><div class="tw"><table>
      <tr><th>Identifiant</th><th>Nom</th><th>Rôle</th><th>Mot de passe</th><th>Compte</th><th></th></tr>
      ${users.map(u => `<tr><td><b>${esc(u.id)}</b></td><td>${esc(u.nom)}</td><td>${u.role === 'admin' ? '🛡️ Administrateur' : '👤 Agent'}</td>
        <td>${u.needsPassword ? '<span class="badge b-att">🔑 À créer à la prochaine connexion</span>' : '<span class="badge b-ok">✅ Créé</span>'}</td>
        <td>${u.actif === false ? '<span class="badge b-ko">⛔ Désactivé</span>' : '<span class="badge b-ok">Actif</span>'}</td>
        <td class="row-actions">
          <button class="tool" data-act="userReset" data-id="${u.id}" title="Réinitialiser le mot de passe">🔄</button>
          <button class="tool" data-act="userCard" data-id="${u.id}" title="Fiche de connexion à imprimer">📄</button>
          ${u.id !== S.me.id ? `<button class="tool" data-act="userToggle" data-id="${u.id}" title="${u.actif===false?'Réactiver':'Désactiver'}">${u.actif===false?'✅':'⛔'}</button>
          <button class="tool" data-act="userRole" data-id="${u.id}" title="Changer le rôle">🛡️</button>` : ''}
        </td></tr>`).join('')}
    </table></div></div>
    <div class="msg info">🔄 <b>Réinitialiser</b> : l’agent choisira un nouveau mot de passe à sa prochaine connexion (l’ancien ne fonctionne plus).<br>📄 <b>Fiche</b> : page à imprimer avec l’identifiant et la légende des pictogrammes, à remettre à l’agent.</div>`;
  S._users = users;
}
ACT.userNew = () => openModal(`<h2>➕ Nouvel agent <button class="xbtn" data-act="closeModal">✕</button></h2>
  <div class="form">
    <label>Identifiant (minuscules et chiffres, sans espace ni accent – ex. : jmarc)</label><input id="uf_i" autocapitalize="none" autocorrect="off" spellcheck="false">
    <label>Nom affiché</label><input id="uf_n" placeholder="ex. : Jean-Marc D.">
    <label>Rôle</label><select id="uf_r"><option value="agent">👤 Agent</option><option value="admin">🛡️ Administrateur</option></select>
  </div>
  <p class="msg info">À sa première connexion, l’agent tape son identifiant puis crée lui-même son mot de passe.</p>
  <div class="modal-actions"><button class="btn2" data-act="closeModal">Annuler</button><button class="bigbtn" data-act="userSave">Créer</button></div>`);
ACT.userSave = async () => {
  const id = $('#uf_i').value.trim().toLowerCase(), nom = $('#uf_n').value.trim();
  if (!/^[a-z0-9]{2,20}$/.test(id)) { toast('❌ Identifiant : 2 à 20 lettres minuscules ou chiffres'); return shake($('#uf_i')); }
  if (!nom) return shake($('#uf_n'));
  if (await S.store.get('users', id)) { toast('❌ Identifiant déjà utilisé'); return shake($('#uf_i')); }
  try { await S.store.set('users', id, {nom, role:$('#uf_r').value, version:1, needsPassword:true, uid:null, actif:true});
    closeModal(); toast('✅ Agent créé'); viewAgents(); } catch(e){ toast('❌ '+errMsg(e)); }
};
ACT.userReset = async el => {
  const id = el.dataset.id;
  if (!cf(`Réinitialiser le mot de passe de « ${id} » ?\nL’agent choisira un nouveau mot de passe à sa prochaine connexion.`)) return;
  try { await S.store.resetUser(id); toast('🔄 Mot de passe réinitialisé'); if (id === S.me.id) return ACT.logout(); viewAgents(); } catch(e){ toast('❌ '+errMsg(e)); }
};
ACT.userToggle = async el => {
  const u = S._users.find(x => x.id === el.dataset.id);
  try { await S.store.update('users', u.id, {actif: u.actif === false}); toast('✅ Enregistré'); viewAgents(); } catch(e){ toast('❌ '+errMsg(e)); }
};
ACT.userRole = async el => {
  const u = S._users.find(x => x.id === el.dataset.id); const nr = u.role === 'admin' ? 'agent' : 'admin';
  if (!cf(`Passer « ${u.id} » en ${nr === 'admin' ? 'administrateur' : 'agent'} ?`)) return;
  try { await S.store.update('users', u.id, {role:nr}); toast('✅ Enregistré'); viewAgents(); } catch(e){ toast('❌ '+errMsg(e)); }
};
ACT.userCard = el => {
  const u = S._users.find(x => x.id === el.dataset.id);
  const w = window.open('', '_blank'); if (!w) return toast('❌ Autorisez les fenêtres pop-up');
  const url = location.href.split('#')[0].split('?')[0];
  w.document.write(emo2svg(`<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><title>Fiche ${esc(u.id)}</title><style>
    body{font-family:"Atkinson Hyperlegible",Arial,sans-serif;color:#17323d;max-width:700px;margin:20px auto;padding:0 20px}
    .hd{display:flex;gap:16px;align-items:center;border-bottom:4px solid #bccb4e;padding-bottom:12px}
    .hd img{width:90px}.box{border:3px dashed #195d74;border-radius:16px;padding:16px;margin:16px 0;font-size:22px}
    .big{font-size:34px;font-weight:700;letter-spacing:2px}.line{border-bottom:2px solid #17323d;height:44px}
    .lg{display:grid;grid-template-columns:70px 1fr;gap:8px 12px;align-items:center;font-size:20px}.lg span:nth-child(odd){font-size:36px;text-align:center}
    .chip{display:inline-block;color:#0f3f50;background:#e3eef2;border-radius:20px;padding:4px 10px;font-size:16px;font-weight:700}
    .ic{width:1.15em;height:1.15em;fill:#195d74;vertical-align:-0.2em}</style></head><body>
    <div class="hd"><img src="${LOGO}"><div><h1 style="margin:0">Complexe sportif Yves du Manoir</h1><div style="font-size:20px">Fréquentation – fiche de connexion</div></div></div>
    <div class="box">🌐 ${esc(url)}</div>
    <div class="box">👤 Identifiant :<div class="big">${esc(u.id)}</div></div>
    <div class="box">🔑 Mot de passe :<div class="line"></div><small style="font-size:15px">À écrire vous-même. Ne le donnez à personne. 📝</small></div>
    <h2>Pictogrammes</h2><div class="lg">
      ${LEGENDE.map(([i,t]) => `<span>${i}</span><span>${t}</span>`).join('')}</div>
    <h2>Salles</h2><div class="lg">${SALLES.map(s => `<span>${s.ico}</span><span><span class="chip">${s.court}</span> ${s.nom}</span>`).join('')}</div>
    <p style="text-align:center;color:#8a9aa0;font-size:12px;margin-top:30px">${COPY}</p>
    <script>setTimeout(()=>print(),400)<\/script></body></html>`));
  w.document.close();
};

boot();
</script>
</body>
</html>
